<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Helsa — a friendly diet tracker. Log meals, see trends, keep your streak."
    />
    <title>Helsa</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Matches --background in index.css so the iOS status bar blends with the app. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#252525" media="(prefers-color-scheme: dark)" />

    <!--
      iOS home-screen install. Safari ignores the manifest's display mode, so
      apple-mobile-web-app-capable is what actually makes the app launch
      chromeless. "default" keeps the status bar legible on the white shell;
      with viewport-fit=cover the app draws under it via safe-area insets.
    -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Helsa" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Stops iOS from turning numbers in logs/reports into tel: links. -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
